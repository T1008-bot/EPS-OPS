function vTimeline(L, w0, w1, nowA) {
  const span = w1 - w0, P = a => (Math.max(0, Math.min(span, a - w0)) / span * 100).toFixed(2) + "%";
  let g = "";
  const step = span > 1440 ? 360 : 180;
  for (let a = Math.ceil(w0 / step) * step; a < w1; a += step) if (a > w0) g += `<i class="vgl${a % 360 ? "" : " g6"}" style="left:${P(a)}"></i>`;
  L.forEach(x => { const tip = E(`${vLab(x)} · ${[x.t1 != null ? x.a0 : null, x.t2 != null ? x.a1 : null].filter(v => v != null).map(v => hhm(v % 1440)).join(" → ")}`); g += x.typ == "R" ? `<b class="vmk vmR" style="left:${P(x.a0)};width:calc(${P(x.a1)} - ${P(x.a0)})" title="${tip}"></b>` : `<b class="vmk vm${x.typ}" style="left:${P(x.a0)}" title="${tip}"></b>`; });
  if (nowA >= w0 && nowA <= w1) g += `<i class="vnw" style="left:${P(nowA)}"></i>`;
  const labs = []; for (let a = w0; a <= w1; a += span > 1440 ? 720 : 360) labs.push(`<span style="left:${P(a)}">${p2(Math.floor(a % 1440 / 60))}h</span>`);
  return `<div class="vtl"><div class="vtb">${g}</div><div class="vtx">${labs.join("")}</div></div>`;
}

function sigList() { const L = sigFlt(); $("#sl").innerHTML = `<div class="m"><b>${L.length}</b> signalement(s)</div><div class="card sc"><table><tr><th>Réf.</th><th>Constat</th><th>Objet / Zone</th><th>Catégorie</th><th>BDM</th><th>Statut</th></tr>${L.map(s => { const late = sigLate(s); return `<tr data-a="sigo" data-i="${s.id}" style="cursor:pointer"><td><b>${E(s.ref.replace("EPS/OPS/SIG/", ""))}</b></td><td>${s.constat_le ? dt(s.constat_le) : "—"}</td><td><span title="Priorité ${s.priorite}" style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${SG_PR[s.priorite]};margin-right:5px"></span><b>${E(s.objet)}</b>${(SPJ[s.id] || []).length ? ` <span class="m">📎${SPJ[s.id].length}</span>` : ""}${s.zone ? `<div class="m">${E(s.zone)}</div>` : ""}${late ? `<div><span class="bd bad">⏱ ${late}</span></div>` : ""}</td><td>${E(s.categorie)}</td><td>${s.bdm ? E(s.bdm) : '<span class="m">—</span>'}</td><td><span class="bd ${SG_B[s.statut]}">${SG_ST[s.statut]}</span></td></tr>`; }).join("") || `<tr><td colspan="6" class="m">Aucun signalement.</td></tr>`}</table></div>`; lab($("#sl")); }
V.sig = async () => {
  const [a, b] = await Promise.all([sb.from("signalements").select("*").order("created_at", { ascending: false }).limit(500), sb.from("signalement_events").select("*").order("quand").limit(3000), pjLoadAll()]);
  if (a.error) throw a.error; SG = a.data || []; SGE = {}; (b.data || []).forEach(e => (SGE[e.signalement_id] = SGE[e.signalement_id] || []).push(e));
  const o = (k, l, opts) => `<select data-g="${k}"><option value="">${l}</option>${opts.map(([v, t]) => `<option value="${v}" ${SGF[k] == v ? "selected" : ""}>${t}</option>`).join("")}</select>`;
  const nda = (ACC[ME.role] || []).includes("cmd") ? await cmNbAFaire() : -1;
  return head("Help Desk", "Signalements externes — suivi jusqu’à la clôture", `<button class="btn w" data-a="signew">+ Signalement</button>`)
    + (nda >= 0 ? `<div class="card row"><div><b>🛒 Demandes d’achat</b><div class="m">Signalements de manque, rupture ou pièce à acheter</div></div><button class="btn ${nda ? "w" : ""}" data-p="cmd">${nda ? nda + " à traiter" : "Ouvrir"}</button></div>` : "")
    + `<div class="card" style="display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))"><input id="sq" placeholder="Rechercher (réf., BDM, objet, zone…)" value="${E(SQ)}">${o("st", "Statut : tous", Object.entries(SG_ST))}${o("bdm", "BDM : tous", [["m", "BDM manquant"], ["p", "BDM renseigné"]])}${o("rep", "Réponse : toutes", [["a", "Réponse absente"], ["r", "Réponse reçue"]])}</div><div id="sl"></div><div class="m">● priorité : gris basse · bleu normale · orange haute · rouge urgente. Touchez une ligne pour ouvrir la fiche.</div>`;
};
function sigF(id) {

${row("Problème :", s.description)}${row("Conséquences :", s.consequences)}${row("Mesures conservatoires :", s.mesures)}${row("Intervention demandée :", s.intervention_demandee)}

function sigMsg(s) { return `HELP DESK — Signalement ${s.ref}\nObjet : ${s.objet}\nZone : ${s.zone || "—"}\nCatégorie : ${s.categorie}${s.sous_categorie ? " / " + s.sous_categorie : ""}\nPriorité : ${s.priorite}\n${s.constat_le ? "Constaté le " + dt(s.constat_le) + "\n" : ""}Problème : ${s.description || "—"}\n${s.consequences ? "Conséquences : " + s.consequences + "\n" : ""}${s.mesures ? "Mesures conservatoires : " + s.mesures + "\n" : ""}Intervention demandée : ${s.intervention_demandee || "—"}\nMerci de nous communiquer le numéro de ticket (BDM) et l’heure d’intervention prévue.\nEPS — ${ME.nom}`; }

V.ir = async () => {

function sigPad(cv) {

function trimPNG(cv) {

  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (d[(y * W + x) * 4 + 3] > 20) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }

}
/* photo d'une signature au stylo : correction de l'éclairage, fond transparent, encre renforcée, recadrage */
function sigPhoto(file) {

    const cv = document.createElement("canvas"); cv.width = W; cv.height = H; const c = cv.getContext("2d"); c.drawImage(im, 0, 0, W, H); URL.revokeObjectURL(u);
    const id = c.getImageData(0, 0, W, H), d = id.data, L = new Float32Array(W * H);
    for (let i = 0; i < W * H; i++) L[i] = 0.299 * d[i * 4] + 0.587 * d[i * 4 + 1] + 0.114 * d[i * 4 + 2];
    /* fond estimé par moyenne locale (image intégrale) pour compenser ombres et éclairage inégal */
    const R = Math.max(12, Math.round(Math.min(W, H) / 12)), S = new Float64Array((W + 1) * (H + 1));
    for (let y = 1; y <= H; y++) { let row = 0; for (let x = 1; x <= W; x++) { row += L[(y - 1) * W + x - 1]; S[y * (W + 1) + x] = S[(y - 1) * (W + 1) + x] + row; } }

}

  d.innerHTML = `<button type="button" class="btn" data-vx="mic">🎤 Dicter</button><button type="button" class="btn" data-vx="lang" title="Langue de la dictée">${VL[VLANG]}</button><button type="button" class="btn" data-vx="fix">✨ Corriger (IA)</button>${en ? `<button type="button" class="btn" data-vx="en">🌐 Traduire en anglais (IA)</button>` : ""}<span class="m vxs"></span>`;
  ta.parentNode.insertBefore(d, ta);
}
function vxStop() { if (VX) { try { VX.stop(); } catch (e) { } VX = null; } document.querySelectorAll('[data-vx="mic"]').forEach(b => b.textContent = "🎤 Dicter"); }
new MutationObserver(() => document.querySelectorAll("#mf textarea").forEach(vxBar)).observe(document.body, { childList: true, subtree: true });
document.addEventListener("click", async e => {
  const b = e.target.closest("[data-vx]"); if (!b || b.dataset.vx == "undo") return; e.preventDefault(); e.stopPropagation();
  const bar = b.closest(".vxb"), ta = bar.nextElementSibling, st = bar.querySelector(".vxs"), k = b.dataset.vx; if (k == "undo") return;
  if (k == "lang") { const ks = Object.keys(VL); VLANG = ks[(ks.indexOf(VLANG) + 1) % ks.length]; try { localStorage.setItem("vlang", VLANG); } catch (x) { } b.textContent = VL[VLANG]; if (VX) { vxStop(); } return; }
  if (k == "mic") {
    if (VX) return vxStop();
    if (!SR) { st.textContent = "Dictée non prise en charge par ce navigateur : utilisez le micro du clavier du téléphone, ou écrivez."; return; }
    const r = new SR(); r.lang = VLANG; r.continuous = true; r.interimResults = true; VX = r; let base = ta.value + (ta.value && !/\s$/.test(ta.value) ? " " : "");
    r.onresult = ev => { let fin = "", tmp = ""; for (let i = 0; i < ev.results.length; i++) { const t = ev.results[i][0].transcript; if (ev.results[i].isFinal) fin += t + " "; else tmp += t; } ta.value = base + fin + tmp; };
    r.onerror = ev => { st.textContent = ev.error == "not-allowed" ? "Micro refusé : autorisez-le dans le navigateur." : "Dictée interrompue (" + ev.error + ")."; vxStop(); };
    r.onend = () => { if (VX == r) { base = ta.value; try { r.start(); } catch (x) { vxStop(); } } };
    try { r.start(); b.textContent = "⏹ Arrêter"; st.textContent = "Je vous écoute… parlez, puis appuyez sur Arrêter."; } catch (x) { VX = null; st.textContent = "Impossible de démarrer le micro."; }
    return;
  }
  vxStop(); const t = ta.value.trim(); if (!t) { st.textContent = "Rien à traiter."; return; }
  b.disabled = true; st.textContent = "Correction en cours…";
  try {
    const { data, error } = await sb.functions.invoke("ia-texte", { body: { texte: t, mode: k == "en" ? "anglais" : "corriger" } });
    if (error) throw error;
    if (data.erreur == "ia_non_configuree") st.textContent = "La correction IA n’est pas encore activée (clé à configurer par l’administrateur).";
    else if (data.erreur) st.textContent = "IA indisponible, réessayez (" + data.erreur + ").";
    else { ta.dataset.avant = t; ta.value = data.texte; st.innerHTML = `Texte corrigé. <a href="#" data-vx="undo">Annuler</a>`; }
  } catch (x) { st.textContent = "IA indisponible : " + (x.message || x); }
  b.disabled = false;
}, true);
document.addEventListener("click", e => { const u = e.target.closest('[data-vx="undo"]'); if (!u) return; e.preventDefault(); e.stopPropagation(); const bar = u.closest(".vxb"), ta = bar.nextElementSibling; ta.value = ta.dataset.avant || ta.value; bar.querySelector(".vxs").textContent = "Texte d’origine rétabli."; }, true);
/* ===== Pièces jointes des signalements (Supabase Storage privé) ===== */
let SPJ = {};
async function pjLoadAll() { const { data } = await sb.from("signalement_pj").select("*").order("created_at").limit(3000); SPJ = {}; (data || []).forEach(p => (SPJ[p.signalement_id] = SPJ[p.signalement_id] || []).push(p)); }
const pjSz = n => n > 1048576 ? (n / 1048576).toFixed(1) + " Mo" : Math.max(1, Math.round(n / 1024)) + " Ko";
const pjBlock = id => `<h2 style="margin-top:6px">Photos et pièces jointes (${(SPJ[id] || []).length})</h2><div id="pjl" class="m">Chargement…</div><div class="row" style="justify-content:flex-start;gap:6px;margin-top:4px"><label class="btn">📷 Prendre une photo<input type="file" id="pjc" accept="image/*" capture="environment" hidden></label><label class="btn">🖼 Photos (galerie)<input type="file" id="pjg" accept="image/*" multiple hidden></label><label class="btn">📎 Documents<input type="file" id="pjf" accept=".pdf,.doc,.docx,.xls,.xlsx,.csv,.txt,.ppt,.pptx,.zip" multiple hidden></label></div><div class="m" id="pjs">Photos réduites automatiquement. Documents : 15 Mo maximum chacun.</div>`;
async function pjDraw(id) {
  const box = $("#pjl"); if (!box) return; const L = SPJ[id] || []; if (!L.length) { box.textContent = "Aucune pièce jointe."; return; }
  const { data } = await sb.storage.from("signalements-pj").createSignedUrls(L.map(p => p.chemin), 3600); const U = {}; (data || []).forEach(x => U[x.path] = x.signedUrl);
  const can = p => p.auteur == ME.id || ["direction", "responsable_ops", "coordinateur_ops"].includes(ME.role);
  if (!$("#pjl")) return;
  $("#pjl").innerHTML = `<div style="display:flex;flex-wrap:wrap;gap:8px">${L.map(p => { const u = U[p.chemin] || "#", x = can(p) ? `<button type="button" class="btn d" style="padding:1px 6px" data-a="pjdel" data-i="${p.id}" title="Supprimer">🗑</button>` : ""; return /^image\//.test(p.mime || "") ? `<div style="width:96px"><a href="${u}" target="_blank" rel="noopener"><img src="${u}" style="width:96px;height:96px;object-fit:cover;border-radius:6px;display:block"></a><div class="m" style="font-size:10px">${E(p.auteur_nom || "")} ${x}</div></div>` : `<div style="min-width:150px"><a href="${u}" target="_blank" rel="noopener">📄 ${E(p.nom)}</a><div class="m" style="font-size:10px">${pjSz(p.taille || 0)} · ${E(p.auteur_nom || "")} ${x}</div></div>`; }).join("")}</div>`;
}
async function pjUpload(files) {
  const id = SO, st = $("#pjs"); if (!id) return; let n = 0;
  for (const f of files) {
    try {
      let body = f, nom = f.name, mime = f.type || "application/octet-stream";
      if (/^image\//.test(mime)) { if (st) st.textContent = "Préparation de la photo…"; const d = await irShrink(f); body = await (await fetch(d)).blob(); mime = "image/jpeg"; nom = nom.replace(/\.[^.]+$/, "") + ".jpg"; }
      else if (f.size > 15728640) { toast(nom + " : plus de 15 Mo"); continue; }
      if (st) st.textContent = "Envoi de " + nom + "…";
      const chemin = id + "/" + Date.now() + "-" + Math.random().toString(36).slice(2, 7) + "-" + nom.replace(/[^\w.\-]+/g, "_");
      const up = await sb.storage.from("signalements-pj").upload(chemin, body, { contentType: mime }); if (up.error) throw up.error;
      const ins = await sb.from("signalement_pj").insert({ signalement_id: id, nom, mime, taille: body.size, chemin, auteur_nom: ME.nom }); if (ins.error) { await sb.storage.from("signalements-pj").remove([chemin]); throw ins.error; }
      n++;
    } catch (x) { toast("Échec : " + (x.message || x)); }
  }
  await pjLoadAll(); if (SO == id) { sigF(id); } if (n) toast(n + " pièce(s) jointe(s) ajoutée(s)");
}
async function pjImages(id) { const L = (SPJ[id] || []).filter(p => /^image\//.test(p.mime || "")); if (!L.length) return []; const { data } = await sb.storage.from("signalements-pj").createSignedUrls(L.map(p => p.chemin), 300); const out = []; for (const x of data || []) { try { const b = await (await fetch(x.signedUrl)).blob(); out.push(await new Promise(ok => { const r = new FileReader(); r.onload = () => ok(r.result); r.readAsDataURL(b); })); } catch (e) { } } return out; }
document.addEventListener("change", e => { if (["pjc", "pjg", "pjf"].includes(e.target.id)) { const fs = [...e.target.files]; e.target.value = ""; pjUpload(fs); } }, true);
document.addEventListener("change", async e => { if (e.target.id == "irf") { for (const f of [...e.target.files]) { try { IRP.push(await irShrink(f)); } catch (x) { toast("Image illisible"); } } e.target.value = ""; return irThumbs(); } if (e.target.dataset.h) { IRFS = e.target.value; return irList(); } const s = e.target.dataset.s; if (s) return setSt(s, e.target.value); const g = e.target.dataset.g; if (g) { SGF[g] = e.target.value; return sigList(); } const k = e.target.dataset.f; if (k) { F[k] = e.target.value; setEl(); } });
$("#md").onclick = e => { if (e.target.id == "md") e.target.classList.remove("on"); };
document.addEventListener("keydown", e => { if (e.key == "Escape") $("#md").classList.remove("on"); });
start();

/* installation de l'app (PWA) */
let DIP = null;
const isStd = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
const iOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
function insBtn() { if (isStd) return; document.querySelectorAll("#ins").forEach(b => b.style.display = ""); }
addEventListener("beforeinstallprompt", e => { e.preventDefault(); DIP = e; insBtn(); });
addEventListener("appinstalled", () => { DIP = null; document.querySelectorAll("#ins").forEach(b => b.style.display = "none"); toast("EPS OPS est installée sur cet appareil"); });
document.addEventListener("change", e => { const f = e.target.closest("[data-eqf]"); if (f) { EQF[f.dataset.eqf] = f.value; draw(); } });
document.addEventListener("click", async e => {
  if (!e.target.closest("#ins")) return;
  if (DIP) { DIP.prompt(); await DIP.userChoice; DIP = null; return; }
  $("#mf").innerHTML = `<h2>Télécharger l’app</h2><div>${iOS ? "Sur iPhone / iPad (Safari) : touchez <b>Partager</b> puis <b>Sur l’écran d’accueil</b>." : "Dans Chrome ou Edge : menu <b>⋮</b> puis <b>Installer l’application</b> (ou <b>Ajouter à l’écran d’accueil</b> sur Android). Sur ordinateur, une icône d’installation apparaît aussi à droite de la barre d’adresse."}</div><div class="row" style="margin-top:12px"><button type="button" class="btn p" id="no">Fermer</button></div>`;
  $("#md").classList.add("on"); $("#no").onclick = () => $("#md").classList.remove("on");

new MutationObserver(insBtn).observe(document.body, { childList: true, subtree: true });
if ("serviceWorker" in navigator) { const hadSW = !!navigator.serviceWorker.controller; let rl = false; navigator.serviceWorker.addEventListener("controllerchange", () => { if (hadSW && !rl) { rl = true; location.reload(); } }); navigator.serviceWorker.register("/sw.js", { updateViaCache: "none" }).then(r => r.update()).catch(() => { }); }
insBtn();
</script>
