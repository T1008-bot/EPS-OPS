/* ---------- Magasin ---------- */

};

/* ---------- Tâches & planning ---------- */

const TS = { a_faire: "À faire", en_cours: "En cours", fait: "Fait", annule: "Annulé" }, TB = { a_faire: "warn", en_cours: "info", fait: "ok", annule: "bad" };
const TMG = ["direction", "responsable_ops", "coordinateur_ops"];

    + (L.map(t => `<div class="card"><div class="row"><b>${E(t.titre)}</b><div><span class="bd ${t.priorite == "haute" ? "bad" : "info"}" ${t.priorite == "haute" ? "" : 'style="display:none"'}>Priorité</span> <span class="bd ${TB[t.statut]}">${TS[t.statut]}</span></div></div>${t.description ? `<div style="margin-top:4px">${E(t.description)}</div>` : ""}<div class="m" style="margin-top:4px">${t.heure ? "⏰ " + E(t.heure) + " · " : ""}${t.cible ? "👥 " + E(t.cible) + " · " : ""}${t.agents ? "👤 " + E(t.agents.nom) + " · " : ""}${t.lieu ? "📍 " + E(t.lieu) + " · " : ""}créée par ${E(t.cree_nom)}${t.maj_nom ? " · " + TS[t.statut].toLowerCase() + " par " + E(t.maj_nom) : ""}${t.commentaire ? " · « " + E(t.commentaire) + " »" : ""}</div><div class="row" style="justify-content:flex-start;gap:6px;margin-top:8px">${t.statut == "a_faire" ? `<button class="btn p" data-a="tst" data-w="en_cours" data-i="${t.id}">Démarrer</button>` : ""}${t.statut == "a_faire" || t.statut == "en_cours" ? `<button class="btn w" data-a="tst" data-w="fait" data-i="${t.id}">Terminé</button><button class="btn" data-a="tst" data-w="annule" data-i="${t.id}">Annuler</button>` : `<button class="btn" data-a="tst" data-w="a_faire" data-i="${t.id}">Rouvrir</button>`}${TMG.includes(ME.role) ? `<button class="btn d" data-a="tdel" data-i="${t.id}">Supprimer</button>` : ""}</div></div>`).join("") || `<div class="card m">Aucune tâche ce jour-là.</div>`);

/* ---------- Help Desk / Signalements ---------- */
const SG_ST = { brouillon: "Brouillon", envoye: "Envoyé", repondu: "Réponse reçue", bdm_attribue: "BDM attribué", en_cours: "En cours", intervention_terminee: "Intervention terminée", verifie: "Vérifié", cloture: "Clôturé" };
const SG_B = { brouillon: "info", envoye: "warn", repondu: "warn", bdm_attribue: "info", en_cours: "info", intervention_terminee: "ok", verifie: "ok", cloture: "ok" };
const SG_EV = { constat: "Constat", envoi: "Envoi au Help Desk", reponse: "Réponse Help Desk", bdm: "Numéro BDM communiqué", intervention_annoncee: "Intervention annoncée", intervention_programmee: "Intervention programmée", intervention_commencee: "Intervention commencée", intervention_terminee: "Intervention terminée", verification: "Vérification EPS", relance: "Relance", commentaire: "Commentaire", cloture: "Clôture", reouverture: "Réouverture" };
const SG_CAT = ["Électricité", "Climatisation", "Plomberie", "Sanitaires", "Nettoyage / Déchets", "Équipement / Matériel", "Sûreté / Accès", "Infrastructure", "Autre"];
const SG_PR = { basse: "#94a3b8", normale: "#0052cc", haute: "#f59e0b", urgente: "#e11d48" };
const SGM = ["direction", "responsable_ops", "coordinateur_ops", "superviseur_principal", "superviseur_nettoyage", "superviseur_bagages"];
let SG = [], SGE = {}, SQ = "", SGF = { st: "", bdm: "", rep: "" }, SO = 0;
const dt = d => { d = new Date(d); return dmy(d) + " " + hm(d); };
const nowL = () => new Date().toISOString().slice(0, 16);
const fromL = v => new Date(v + ":00Z").toISOString();
const evs = id => (SGE[id] || []).slice().sort((a, b) => new Date(a.quand) - new Date(b.quand));
const firstEv = (id, t) => evs(id).find(e => e.type == t);
function dur(a, b) { if (!a || !b) return "—"; let m = Math.round((new Date(b) - new Date(a)) / 6e4); if (m < 0) return "—"; const d = Math.floor(m / 1440), h = Math.floor(m % 1440 / 60); m = m % 60; return (d ? d + " j " : "") + (h ? h + " h " : "") + m + " min"; }
function sigLate(s) { if (s.statut == "cloture" || s.statut == "brouillon") return ""; const e = firstEv(s.id, "envoi"); if (!e) return ""; const age = Date.now() - new Date(e.quand); if (!firstEv(s.id, "reponse") && !firstEv(s.id, "bdm") && age > 24 * H) return "Sans réponse > 24 h"; if (age > 72 * H) return "Ouvert > 72 h"; return ""; }
function sigFlt() { const q = N(SQ); return SG.filter(s => (!q || N([s.ref, s.objet, s.zone, s.categorie, s.sous_categorie, s.bdm, s.description].join(" ")).includes(q)) && (!SGF.st || s.statut == SGF.st) && (!SGF.bdm || (SGF.bdm == "m") == !s.bdm) && (!SGF.rep || (SGF.rep == "a") == !firstEv(s.id, "reponse"))); }
function sigList() { const L = sigFlt(); $("#sl").innerHTML = `<div class="m"><b>${L.length}</b> signalement(s)</div><div class="card sc"><table><tr><th>Réf.</th><th>Constat</th><th>Objet / Zone</th><th>Catégorie</th><th>BDM</th><th>Statut</th></tr>${L.map(s => { const late = sigLate(s); return `<tr data-a="sigo" data-i="${s.id}" style="cursor:pointer"><td><b>${E(s.ref.replace("EPS/OPS/SIG/", ""))}</b></td><td>${s.constat_le ? dt(s.constat_le) : "—"}</td><td><span title="Priorité ${s.priorite}" style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${SG_PR[s.priorite]};margin-right:5px"></span><b>${E(s.objet)}</b>${(SPJ[s.id] || []).length ? ` <span class="m">📎${SPJ[s.id].length}</span>` : ""}${s.zone ? `<div class="m">${E(s.zone)}</div>` : ""}${late ? `<div><span class="bd bad">⏱ ${late}</span></div>` : ""}</td><td>${E(s.categorie)}</td><td>${s.bdm ? E(s.bdm) : '<span class="m">—</span>'}</td><td><span class="bd ${SG_B[s.statut]}">${SG_ST[s.statut]}</span></td></tr>`; }).join("") || `<tr><td colspan="6" class="m">Aucun signalement.</td></tr>`}</table></div>`; lab($("#sl")); }
V.sig = async () => {
  const [a, b] = await Promise.all([sb.from("signalements").select("*").order("created_at", { ascending: false }).limit(500), sb.from("signalement_events").select("*").order("quand").limit(3000), pjLoadAll()]);
  if (a.error) throw a.error; SG = a.data || []; SGE = {}; (b.data || []).forEach(e => (SGE[e.signalement_id] = SGE[e.signalement_id] || []).push(e));

  return head("Help Desk", "Signalements externes — suivi jusqu’à la clôture", `<button class="btn w" data-a="signew">+ Signalement</button>`)
    + `<div class="card" style="display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))"><input id="sq" placeholder="Rechercher (réf., BDM, objet, zone…)" value="${E(SQ)}">${o("st", "Statut : tous", Object.entries(SG_ST))}${o("bdm", "BDM : tous", [["m", "BDM manquant"], ["p", "BDM renseigné"]])}${o("rep", "Réponse : toutes", [["a", "Réponse absente"], ["r", "Réponse reçue"]])}</div><div id="sl"></div><div class="m">● priorité : gris basse · bleu normale · orange haute · rouge urgente. Touchez une ligne pour ouvrir la fiche.</div>`;
};
function sigF(id) {
  const s = SG.find(x => x.id == id); if (!s) return; SO = id; const mg = SGM.includes(ME.role), E0 = evs(id), cl = s.statut == "cloture";
  const ce = firstEv(id, "constat"), tl = [...(s.constat_le && !ce ? [{ type: "constat", quand: s.constat_le, source: s.constat_source, auteur_nom: s.constat_auteur, contenu: "" }] : []), ...E0].sort((a, b) => new Date(a.quand) - new Date(b.quand));
  const t = n => firstEv(id, n)?.quand, env = t("envoi"), fin = t("intervention_terminee") || t("cloture");
  const row = (l, v) => v ? `<div class="m"><b>${l}</b> ${E(v)}</div>` : "";
  $("#mf").innerHTML = `<div class="row"><h2>${E(s.objet)}</h2><span class="bd ${SG_B[s.statut]}">${SG_ST[s.statut]}</span></div>
<div class="m">${E(s.ref)} · BDM : <b>${s.bdm ? E(s.bdm) : "—"}</b> · ${E(s.categorie)}${s.sous_categorie ? " / " + E(s.sous_categorie) : ""} · ${E(s.zone) || "zone ?"} · priorité <b style="color:${SG_PR[s.priorite]}">${s.priorite}</b></div>
${row("Problème :", s.description)}${row("Conséquences :", s.consequences)}${row("Mesures conservatoires :", s.mesures)}${row("Intervention demandée :", s.intervention_demandee)}
<h2 style="margin-top:6px">Chronologie</h2>${tl.map(e => `<div class="li" style="align-items:flex-start"><div><b>${SG_EV[e.type]}</b>${e.type == "envoi" && !e.confirme_manuel ? "" : ""}<div class="m">${e.contenu ? E(e.contenu) + " · " : ""}${e.canal ? E(e.canal) + " · " : ""}${e.destinataire ? "à " + E(e.destinataire) + " · " : ""}${e.type == "envoi" ? "envoi déclaré manuellement · " : ""}${e.source ? "source : " + E(e.source) + " · " : ""}${E(e.auteur_nom) || ""}</div></div><div class="m" style="white-space:nowrap">${dt(e.quand)}</div></div>`).join("") || '<div class="m">Aucun événement.</div>'}

function sigMsg(s) { return `HELP DESK — Signalement ${s.ref}\nObjet : ${s.objet}\nZone : ${s.zone || "—"}\nCatégorie : ${s.categorie}${s.sous_categorie ? " / " + s.sous_categorie : ""}\nPriorité : ${s.priorite}\n${s.constat_le ? "Constaté le " + dt(s.constat_le) + "\n" : ""}Problème : ${s.description || "—"}\n${s.consequences ? "Conséquences : " + s.consequences + "\n" : ""}${s.mesures ? "Mesures conservatoires : " + s.mesures + "\n" : ""}Intervention demandée : ${s.intervention_demandee || "—"}\nMerci de nous communiquer le numéro de ticket (BDM) et l’heure d’intervention prévue.\nEPS — ${ME.nom}`; }
async function sigEvent(id, type, quand, contenu, source, canal, dest, conf) { const { error } = await sb.rpc("sig_event", { p_id: id, p_type: type, p_quand: quand || new Date().toISOString(), p_contenu: contenu || null, p_source: source || null, p_canal: canal || null, p_dest: dest || null, p_confirme: !!conf }); toast(error ? "Refusé : " + error.message : "Enregistré"); await draw(); if (!error || SG.find(x => x.id == id)) sigF(id); }
