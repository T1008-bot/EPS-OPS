<style>
/* Page publique « Programme de vol » : vols réguliers NKC, mise à jour quotidienne (vols-data.json) */
:root{-webkit-text-size-adjust:100%;text-size-adjust:100%;color-scheme:light;--bg:#E6EEFA;--s:#fff;--t:#13294F;--m:#5B6D8C;--b:#CBDAF0;--p:#2F6FD0;--pl:#E1ECFB;--n:#2358A8;--n2:#1B4890;--red:#C0392B;--sh:0 1px 2px #1b489214,0 6px 18px #1b48921a;--sp:cubic-bezier(.34,1.32,.64,1)}
.vrs{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;position:sticky;top:0;z-index:4;background:var(--bg);padding:4px 0}
.vmain{display:flex;flex-direction:column;gap:12px}.vmain[hidden]{display:none}@media(max-width:700px){.vmain{gap:12px}}.vqs{position:relative}.vqs input{width:100%;box-sizing:border-box;font:inherit;font-size:16px;padding:11px 12px 11px 38px;border:1px solid var(--b);border-radius:12px;background:var(--s);color:var(--t)}.vqs:before{content:"🔍";position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:15px;opacity:.6}
.vqh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin:2px 0}.vqc{padding:10px 12px;display:grid;gap:6px}.vqc+.vqc{margin-top:8px}
.vwk{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}.vwk div{text-align:center;border-radius:7px;padding:4px 0;font-size:11px;line-height:1.35;border:1px solid var(--b)}.vwk span{display:block;font-weight:700;font-size:10px;text-transform:uppercase;color:var(--m)}.vwk .on{background:var(--pl);border-color:transparent}.vwk .off{opacity:.38}.vwk .a{color:var(--p);font-weight:700}.vwk .d{color:#b8740a;font-weight:700}
.vwt{padding:0;overflow-x:auto;-webkit-overflow-scrolling:touch}.vwt table{border-collapse:separate;border-spacing:0;font-size:11px;width:100%;min-width:600px;table-layout:fixed}.vwt th,.vwt td{border-bottom:1px solid var(--b);padding:4px 3px;vertical-align:top;text-align:left}.vwt tr:last-child td{border-bottom:0}.vwt th{font-size:10px;text-transform:uppercase;color:var(--m);text-align:center;font-weight:800}.vwt th small{display:block;font-weight:500;text-transform:none}.vwt th:first-child,.vwt td:first-child{position:sticky;left:0;z-index:1;background:var(--s);width:86px;min-width:86px;max-width:96px;border-right:1px solid var(--b);text-align:left}.vwt td:first-child b{display:block;font-size:11.5px;line-height:1.2}.vwt td:first-child small{color:var(--m)}.vwt .td{background:#e1ecfb80}.vwt th.td{color:var(--n)}
.vwi{line-height:1.25;padding:2px 4px;border-radius:5px;border-left:3px solid #6d5bd0;background:#6d5bd00d;min-width:0;overflow:hidden}.vwi span{display:block;white-space:nowrap;font-variant-numeric:tabular-nums}.vwi em{display:block;font-style:normal;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;color:var(--m)}.vwi+.vwi{margin-top:3px}.vwi.A{border-color:var(--p);background:#2f6fd00d}.vwi.D{border-color:#b8740a;background:#c27c0e0d}.vwi b{display:block;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:clip}.vwi .a{color:var(--p);font-weight:700}.vwi .d{color:#b8740a;font-weight:700}.vwi sup{font-size:8px}
.vwj{padding:8px;font-size:11px;overflow-x:auto;-webkit-overflow-scrolling:touch}.vwj>div{display:grid;grid-template-columns:repeat(7,minmax(78px,1fr));gap:4px;min-width:574px}.vwj section{min-width:0}.vwj section{display:flex;flex-direction:column;gap:3px;border-radius:8px;padding:3px}.vwj section.td{background:#e1ecfb80}.vwj h4{margin:0 0 2px;text-align:center;font-size:10px;text-transform:uppercase;color:var(--m);font-weight:800;line-height:1.3}.vwj h4 small{display:block;font-weight:500;text-transform:none}.vwj section.td h4{color:var(--n)}.vwj .vwi+.vwi{margin-top:0}
.vrd{border:1px solid var(--b);background:var(--s);color:var(--t);border-radius:10px;padding:5px 2px;display:flex;flex-direction:column;align-items:center;gap:1px;font:inherit;cursor:pointer;min-width:0}
.vrd span{font-size:11px;font-weight:700;text-transform:uppercase;color:var(--m)}.vrd b{font-size:20px;line-height:1.1}.vrd small{font-size:10px;color:var(--m)}
.vrd.on{background:var(--n);border-color:var(--n);color:#fff}.vrd.on span,.vrd.on small{color:#fff;opacity:.8}
.vrk{display:flex;gap:6px;flex-wrap:wrap}.vrk span{font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px}
.vrk .R,.vrr.R .vrb{background:#6d5bd01f;color:#6d5bd0}.vrk .A,.vrr.A .vrb{background:var(--pl);color:var(--p)}.vrk .D,.vrr.D .vrb{background:#c27c0e1f;color:#b8740a}
.vnx{margin-top:8px;font-size:13px;padding:6px 8px;border-radius:8px;background:var(--bg);display:flex;gap:6px;align-items:center}.vnx i{width:7px;height:7px;border-radius:50%;background:#dc2626;flex:none}
.vtl{margin-top:8px}.vtb{position:relative;height:24px;border-radius:6px;background:var(--bg)}
.vgl{position:absolute;top:0;bottom:0;width:1px;background:var(--b)}.vgl.g6{background:var(--m);opacity:.35}
.vmk{position:absolute;top:50%;transform:translateY(-50%)}.vmR{height:12px;border-radius:6px;background:#6d5bd0;opacity:.85;min-width:6px}
.vmA,.vmD{width:11px;height:11px;margin-left:-5.5px;border-radius:50%;border:2px solid var(--s)}.vmA{background:var(--p)}.vmD{background:#c27c0e}
.vnw{position:absolute;top:-3px;bottom:-3px;width:2px;margin-left:-1px;background:#dc2626}
.vtx{position:relative;height:14px;font-size:10px;color:var(--m)}.vtx span{position:absolute;top:2px;transform:translateX(-50%)}.vtx span:first-child{transform:none}.vtx span:last-child{transform:translateX(-100%)}
.vrg{display:flex;justify-content:space-between;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--m);padding:4px 4px 0;margin-bottom:-6px}
.card.vrl{padding:0;overflow:hidden}
.vrr{display:grid;grid-template-columns:4px 62px 1fr auto;gap:0 10px;align-items:center;padding:8px 10px 8px 0;border-top:1px solid var(--b)}.vrr:first-child{border-top:0}
.vrr>i{align-self:stretch;border-radius:0 2px 2px 0}.vrr.R>i{background:#6d5bd0}.vrr.A>i{background:var(--p)}.vrr.D>i{background:#c27c0e}
.vrt{display:flex;flex-direction:column;font:700 14px/1.3 ui-monospace,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}.vrt .a{color:var(--p)}.vrt .d{color:#b8740a}.vrt sup{font-size:9px}
.vrv{min-width:0}.vrv>b{font-size:15px}.vrv .m{overflow-wrap:anywhere}.vro{font-size:11.5px;color:var(--m);font-style:italic}
.vrb{background:#6d5bd01f;color:#6d5bd0}.vrk .A,.vrr.A .vrb{background:var(--pl);color:var(--p)}.vrk .D,.vrr.D .vrb{background:#c27c0e1f;color:#b8740a}
.vrn{border-left:4px solid #f59e0b;font-size:13px;line-height:1.45}
.vlv{margin-top:3px;display:flex;gap:4px;flex-wrap:wrap}.vrb{font-size:10px;font-weight:800;text-transform:uppercase;padding:3px 6px;border-radius:5px}.vrr.past{opacity:.45}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--t);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:12px 14px 40px;display:flex;flex-direction:column;gap:10px}
h1{font-size:19px;margin:4px 0 0}.m{color:var(--m);font-size:13px}
.card{background:var(--s);border:1px solid var(--b);border-radius:14px;padding:12px 14px;box-shadow:var(--sh)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.btn{border:1px solid var(--b);background:var(--s);color:var(--t);border-radius:10px;padding:6px 10px;font:600 13px system-ui;cursor:pointer}
.btn.p{background:var(--p);border-color:var(--p);color:#fff}
.bd{display:inline-block;padding:2px 8px;border-radius:8px;font-size:11px;font-weight:700}.warn{background:#f59e0b26;color:#a76a10}
select{font:inherit;padding:6px 8px;border:1px solid var(--b);border-radius:8px;background:var(--s);color:var(--t)}
.vrr.past{opacity:.45}
.btn:focus-visible,.vrd:focus-visible{outline:2px solid var(--p);outline-offset:2px}
footer{font-size:11.5px;color:var(--m);padding:6px 2px}
</style>

<body>
<main id="app"><div class="card m">Chargement du programme…</div></main>
<script>
const H = 36e5, p2 = n => String(n).padStart(2, "0");
const ymd = d => new Date(d).toISOString().slice(0, 10);
const IATA = { GMMN: "CMN", GOBD: "DSS", DTTA: "TUN", GABS: "BKO", GBYD: "BJL", LTFM: "IST", GQPP: "NDB", GCLP: "LPA", GUCY: "CKY", DAAG: "ALG", LFPG: "CDG", GQNO: "NKC", GQNI: "EMN", LPLA: "TER", GMFF: "FEZ", GQPZ: "OUZ", DIAP: "ABJ" };
const ap = c => c ? (IATA[c] || c) : "—";
const nvol = n => String(n || "").toUpperCase().replace(/[^A-Z0-9]/g, "").replace(/^([A-Z]{2}|[A-Z][0-9]|[0-9][A-Z])0+(?=[0-9])/, "$1");;
const CIE2 = { L6: "Mauritania Airlines", AT: "Royal Air Maroc", KP: "ASKY Airlines", TK: "Turkish Airlines", AF: "Air France", AH: "Air Algérie", NT: "Binter Canarias", TU: "Tunisair", WT: "Swiftair", D0: "DHL", "2J": "Air Burkina", HC: "Air Sénégal", ET: "Ethiopian Airlines", SN: "Brussels Airlines" };
const CIE4 = { MAI: "Mauritania Airlines", RAM: "Royal Air Maroc", ETH: "ASKY Airlines", THY: "Turkish Airlines", AFR: "Air France", DAH: "Air Algérie", IBB: "Binter Canarias", TAR: "Tunisair", SWT: "Swiftair", SET: "DHL", SIV: "DHL", VBW: "Air Burkina", MSS: "Navette MSS", DUC: "Privé" };
const vIata = n => /^([A-Z]{2}|[A-Z]\d|\d[A-Z])\d{1,4}[A-Z]?$/.test(n);
const vAlias = n => { n = nvol(n); const m = n.match(/^SIV(\d+)$/); return m ? "D0" + m[1] : n; };
const vCie = v => { const n = vAlias(v.numero); return (vIata(n) && CIE2[n.slice(0, 2)]) || CIE4[v.compagnie] || v.compagnie || "—"; };
const vCargo = v => /^(D0|WT)/.test(vAlias(v.numero)) || ["SET", "SIV", "SWT", "DHK", "DHX", "BCS", "FDX", "UPS"].includes(v.compagnie);
/* vols cargo : nom de la compagnie devant le numéro (DHL D0104, Swiftair WT193) */
const vCpx = v => { const n = vAlias(v.numero || ""); return /^D0/.test(n) || ["SET", "SIV"].includes(v.compagnie) ? "DHL" : /^WT/.test(n) || v.compagnie == "SWT" ? "Swiftair" : vCargo(v) ? vCie(v) : ""; };
const vLab = (x, n) => (x.pfx ? x.pfx + " " : "") + (n == null ? x.num : n);
const vNum = v => { const p = vCpx(v); return (p ? p + " " : "") + (v.numero || ""); };
/* retours confirmés par l'exploitation : AH4014 → AH4015, et plus généralement Air Algérie N (pair) → N+1 */
const VRET = { AH4014: "AH4015" };
const vRet = n => { if (VRET[n]) return VRET[n]; const m = /^AH(\d+)$/.exec(n || ""); return m && +m[1] % 2 == 0 ? "AH" + (+m[1] + 1) : null; };
const vMAI = v => /^L6/.test(vAlias(v.numero)) || v.compagnie == "MAI";
const vCat = v => { const n = vAlias(v.numero); if (v.compagnie == "MSS" || /^MSS/.test(n)) return "nav"; if (vIata(n)) return "com"; if (/^[A-Z]{3}\d/.test(n)) return "aut"; return "prv"; };
const JSEM = ["Dim", "Lun", "Mar", "Mer", "Jeu", "Ven", "Sam"], JSEML = ["Dimanche", "Lundi", "Mardi", "Mercredi", "Jeudi", "Vendredi", "Samedi"];
/* recherche dans le programme de la semaine : numéro de vol, compagnie, destination (code ou ville) */
const VILLE = { CMN: "Casablanca", DSS: "Dakar", TUN: "Tunis", BKO: "Bamako", BJL: "Banjul", IST: "Istanbul", NDB: "Nouadhibou", LPA: "Las Palmas Gran Canaria Canaries", CKY: "Conakry", ALG: "Alger Algiers", CDG: "Paris", EMN: "Nema", TER: "Terceira Lajes Acores", FEZ: "Fes Fez", OUZ: "Zouerate", ABJ: "Abidjan" };
const vNorm = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
let VQ = "", VQF = "T", VQDAYS = null;
function vSearchHTML() {
  const q = vNorm(VQ).trim(); if (!q || !VQDAYS) return "";
  const toks = q.split(/\s+/), G = {};
  /* 7 jours à partir d'aujourd'hui : chaque jour de la semaine une fois */
  VQDAYS.slice(1, 8).forEach(D => D.it.forEach(x => {
    const codes = x.route.match(/[A-Z]{3}/g) || [];
    const hay = vNorm([x.num, vLab(x), x.cie, x.route, codes.map(c => VILLE[c] || "").join(" "), { R: "rotation", A: "arrivee", D: "depart" }[x.typ], x.cargo ? "cargo" : ""].join(" ")), hz = hay.replace(/[\s/]+/g, "");
    if (!toks.every(t => hay.includes(t) || hz.includes(t))) return;
    const g = G[x.typ + "|" + x.num] = G[x.typ + "|" + x.num] || { x, d: {} }; g.d[D.w] = x;
  }));
  const all = Object.values(G).sort((a, b) => vLab(a.x).localeCompare(vLab(b.x), "fr", { numeric: true }));
  const n = k => all.filter(g => k == "T" || g.x.typ == k).length, L = all.filter(g => VQF == "T" || g.x.typ == VQF);
  const chip = (k, l) => `<button type="button" class="btn${VQF == k ? " p" : ""}" data-a="vqf" data-k="${k}" data-qf="${k}" style="padding:6px 10px;min-height:0">${l} (${n(k)})</button>`;
  const ord = [1, 2, 3, 4, 5, 6, 0], h = (m, e) => `${e ? "≈" : ""}${hhm(m % 1440)}${m >= 1440 ? "<sup>+1</sup>" : ""}`;
  const card = ({ x, d }) => { const js = ord.filter(w => d[w]);
    return `<div class="card vqc"><div class="row" style="align-items:baseline;gap:8px"><div><b>${E(vLab(x))}</b>${x.cargo ? ` <span class="bd warn">Cargo</span>` : ""}<div class="m">${x.pfx ? "" : E(x.cie) + " · "}${E(x.route)}</div></div><span class="vrb" style="${{ R: "background:#6d5bd01f;color:#6d5bd0", A: "background:var(--pl);color:var(--p)", D: "background:#c27c0e1f;color:#b8740a" }[x.typ]}">${{ R: "Rotation", A: "Arrivée", D: "Départ" }[x.typ]}</span></div>
<div class="m"><b>${js.length} jour${js.length > 1 ? "s" : ""} / semaine</b> : ${js.map(w => JSEML[w]).join(", ")}</div>
<div class="vwk">${ord.map(w => { const y = d[w]; return `<div class="${y ? "on" : "off"}"><span>${JSEM[w]}</span>${y ? (y.t1 != null ? `<i class="a" style="font-style:normal;display:block">${h(y.t1, y.e1)}</i>` : "") + (y.t2 != null ? `<i class="d" style="font-style:normal;display:block">${h(y.t2, y.e2)}</i>` : "") : "—"}</div>`; }).join("")}</div></div>`; };
  return `<div class="vqh"><b>${all.length} vol${all.length > 1 ? "s" : ""} régulier${all.length > 1 ? "s" : ""} pour « ${E(VQ.trim())} »</b><span class="m">heures prévues : <span style="color:var(--p);font-weight:700">arrivée</span> · <span style="color:#b8740a;font-weight:700">départ</span></span></div>
<div style="display:flex;gap:4px;flex-wrap:wrap;margin:6px 0 8px">${chip("T", "Tout")}${chip("A", "Arrivées")}${chip("D", "Départs")}${chip("R", "Rotations")}</div>
${L.map(card).join("") || `<div class="card m">Aucun vol régulier ne correspond. Essayez un numéro (AT511), une compagnie (Air France) ou une ville (Casablanca, CMN).</div>`}`;
}
document.addEventListener("input", e => { if (e.target.id != "vq") return; VQ = e.target.value; const r = document.getElementById("vqr"), m = document.getElementById("vmain"); if (r) r.innerHTML = vSearchHTML(); if (m) m.hidden = !!VQ.trim(); });
/* semaine par compagnie : une ligne par compagnie, une colonne par jour (lundi → dimanche), numéros et heures prévues dans chaque case */
function vWeekHTML(days, f, mode, rot2) {
  const ord = [1, 2, 3, 4, 5, 6, 0], C = {}, DW = {}, sem = days.slice(1, 8), tw = sem[0].w;
  sem.forEach(D => { DW[D.w] = D; D.it.filter(f).forEach(x => { const c = x.pfx || x.cie; ((C[c] = C[c] || {})[D.w] = C[c][D.w] || []).push(x); }); });
  const cos = Object.keys(C).sort((a, b) => a.localeCompare(b, "fr"));
  if (!cos.length) return `<div class="card m">Aucun vol régulier pour ce filtre.</div>`;
  /* AH4014 / AH4015 → AH4014/15 (notation courante des rotations) */
  const sn = n => { const [a, b] = n.split(" / "); if (!b) return a; let c = 0; while (c < a.length && a[c] == b[c]) c++; return c < 2 ? a + "/" + b : a + "/" + b.slice(Math.max(2, Math.min(c, b.length - 2))); };
  const h = (m, e) => `${e ? "≈" : ""}${hhm(m % 1440)}${m >= 1440 ? "<sup>+1</sup>" : ""}`;
  /* une information par ligne : compagnie cargo, numéro, arrivée, départ — rien ne déborde de la colonne */
  const it = (x, pf) => `<div class="vwi ${x.typ}">${pf && x.pfx ? `<em>${E(x.pfx)}</em>` : ""}<b>${E(sn(x.num))}</b>${x.t1 != null ? `<span class="a">${x.t2 != null ? "▾ " : ""}${h(x.t1, x.e1)}</span>` : ""}${x.t2 != null ? `<span class="d">${x.t1 != null ? "▴ " : ""}${h(x.t2, x.e2)}</span>` : ""}</div>`;
  const mv = L => L.reduce((s, x) => s + (x.typ == "R" && rot2 ? 2 : 1), 0), byT = (a, b) => (a.t1 ?? a.t2) - (b.t1 ?? b.t2);
  const leg = `<div class="m" style="font-size:12px">Heures prévues : <span style="color:var(--p);font-weight:700">▾ arrivée</span> · <span style="color:#b8740a;font-weight:700">▴ départ</span> · « ≈ » estimée · <sup>+1</sup> lendemain · barre violette = rotation${rot2 ? "" : " (comptée comme un seul vol)"}. Faites glisser le tableau horizontalement sur téléphone.</div>`;
  if (mode == "semj") {
    /* sans colonne compagnie : chaque jour en ordre chronologique */
    const itj = x => it(x, true);
    return `<div class="card vwj"><div>${ord.map(w => { const L = sem.find(D => D.w == w).it.filter(f).sort(byT); return `<section class="${w == tw ? "td" : ""}"><h4>${JSEM[w]}<small>${DW[w].j.slice(8, 10)}/${DW[w].j.slice(5, 7)} · ${mv(L)} vol${mv(L) > 1 ? "s" : ""}</small></h4>${L.map(itj).join("")}</section>`; }).join("")}</div></div>${leg}`;
  }
  return `<div class="card vwt"><table><thead><tr><th>Compagnie</th>${ord.map(w => `<th class="${w == tw ? "td" : ""}">${JSEM[w]}<small>${DW[w] ? DW[w].j.slice(8, 10) + "/" + DW[w].j.slice(5, 7) : ""}</small></th>`).join("")}</tr></thead><tbody>${cos.map(c => `<tr><td><b>${E(c)}</b><small>${mv(Object.values(C[c]).flat())} vols / sem.</small></td>${ord.map(w => `<td class="${w == tw ? "td" : ""}">${(C[c][w] || []).sort(byT).map(x => it(x)).join("")}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
${leg}`;
}
const PERL = ["Nuit · 00h–06h", "Matin · 06h–12h", "Après-midi · 12h–18h", "Soir · 18h–24h"];
const VTRL = [["heure", "Heure"], ["compagnie", "Compagnie"], ["creneau", "Créneau horaire"], ["type", "Type (rotation, arrivée, départ)"], ["cargo", "Passagers / cargo"]];
const hhm = m => p2(Math.floor(m / 60) % 24) + ":" + p2(m % 60);
const vMed = a => { const s = [...a].sort((x, y) => x - y); return s[Math.floor((s.length - 1) / 2)]; };
const vMode = a => { const c = {}; a.forEach(x => c[x] = (c[x] || 0) + 1); return Object.keys(c).sort((x, y) => c[y] - c[x])[0] || null; };
const VGRP = {
  compagnie: x => [x.cie, x.cie],
  creneau: x => { if (x.ck != null) return [x.ck, x.cl]; const p = Math.min(3, Math.floor(x.md / 360)); return [p, PERL[p]]; },
  type: x => [{ R: 0, A: 1, D: 2 }[x.typ], { R: "Rotations", A: "Arrivées", D: "Départs" }[x.typ]],
  cargo: x => [x.cargo ? 1 : 0, x.cargo ? "Cargo" : "Passagers"]
};

function vGroup(items, mode) {
  const s = [...items].sort((a, b) => a.k0 - b.k0), f = VGRP[mode];

  else if (b.id == "cp") { const L = vGroup(LAST.its, "heure")[0][1], n = L.length, T = [`Vols réguliers NKC — ${LAST.lab} du ${JSEML[LAST.d.getUTCDay()]} ${dmy(LAST.d)} (${n} vols)`, "Programme indicatif (heures prévues), sous réserve de changements.", ""]; L.forEach(x => T.push(`${x.typ == "R" ? (x.e1 ? "≈" : "") + hhm(x.a0 % 1440) + " → " + (x.e2 ? "≈" : "") + hhm(x.a1 % 1440) : ((x.e1 || x.e2) ? "≈" : "") + hhm(x.a0 % 1440)}  ${vLab(x)}  ${{ R: "Rotation", A: "Arrivée", D: "Départ" }[x.typ]}  ${x.route}`)); navigator.clipboard.writeText(T.join("\n")).then(() => b.textContent = "✓ Copié", () => b.textContent = "Copie impossible"); return; }
  else return;
  render();
});
document.addEventListener("change", e => { if (e.target.id == "tri") { TRI = e.target.value; try { localStorage.setItem("pv_tri", TRI); } catch (x) { } render(); } });
fetch("vols-data.json", { cache: "no-store" }).then(r => r.json()).then(D => { GEN = new Date(D.genere_le); R = vregData(D); render(); setInterval(() => { if (!document.activeElement || document.activeElement.id != "vq") render(); }, 60000); })
  .catch(err => { document.getElementById("app").innerHTML = `<div class="card">Programme indisponible pour le moment (${E(err.message)}).</div>`; });
</script>
